name: MCP tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pcsx2-mcp-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24 action runtime)
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 (Node 24 action runtime)
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pcsx2-mcp-server/package-lock.json
      - run: npm ci
      - run: node --check test/stability-live.mjs
      - run: node --check test/soak-live.mjs
      - run: node --check test/dap-live.mjs
      - run: node --check test/vscode-live.mjs
      - run: node --check test/input-state-live.mjs
      - run: node --check test/input-state-movie-live.mjs
      - run: node --check test/input-movie-live.mjs
      - run: node --check test/conditional-points-live.mjs
      - run: node --check test/gui-options-live.mjs
      - run: node --check test/application-ui-live.mjs
      - run: node --check test/application-ui-bootstrap-live.mjs
      - run: node --check test/iop-lifetime-live.mjs
      - run: node --check test/iop-bindings-live.mjs
      - run: npm test
